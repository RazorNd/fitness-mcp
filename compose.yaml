services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:0.38.0'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
  postgres:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=fitness-mcp'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=user'
    ports:
      - '54528:5432'
