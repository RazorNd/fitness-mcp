spring:
  application:
    name: fitness-mcp
  ai:
    mcp:
      server:
        name: \${spring.application.name}
        version: "${version}"
        protocol: stateless
        capabilities:
          completion: false
          resource: false
          prompt: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.razornd.ru

logging:
  structured:
    json:
      add:
        service.name: \${spring.application.name}
        service.version: "${version}"
